name: ryvo_customer
description: Ryvo - Ride sharing app (Customer)
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI & Typography
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  cupertino_icons: ^1.0.8

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Image
  image_picker: ^1.1.2

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2

  url_launcher: ^6.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  # Payments
  flutter_stripe: ^13.1.0

  # Realtime & push
  socket_io_client: ^2.0.3+1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  # pdf allows image 4.11, which calls archive APIs missing from archive 4.0.x.
  image: 4.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_ios_dark_transparent: "assets/images/app_icon_dark.png"
  adaptive_icon_background: "#B5F558"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#B5F558"
  web:
    generate: false
  windows:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
