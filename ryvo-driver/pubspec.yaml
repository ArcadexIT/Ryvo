name: ryvo_driver
description: Ryvo - Emergency Car Jump-Start Provider App
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  audioplayers: ^6.1.0

  intl: ^0.20.2

  # Phase 2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_database: ^11.2.0
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_polyline_points: ^2.1.0
  file_picker: ^8.1.6
  connectivity_plus: ^6.1.1
  socket_io_client: ^2.0.3+1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  image_path_ios_dark_transparent: "assets/images/app_icon_dark.png"
  adaptive_icon_background: "#B5F558"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#B5F558"
  web:
    generate: false
  windows:
    generate: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/sounds/
