services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ryvo-postgres
    environment:
      POSTGRES_USER: ryvo
      POSTGRES_PASSWORD: ryvo_secret
      POSTGRES_DB: ryvo
    ports:
      - "5433:5432"
    volumes:
      - ryvo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryvo -d ryvo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ryvo-redis
    ports:
      - "6379:6379"
    volumes:
      - ryvo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ryvo_pg_data:
  ryvo_redis_data:
